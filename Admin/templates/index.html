<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka Streaming Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #f5f5f5;
            color: #333;
            font-weight: 600;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-approved {
            background: #d1ecf1;
            color: #0c5460;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px 0;
            transition: background 0.3s;
        }
        .refresh-btn:hover {
            background: #5568d3;
        }
        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Kafka Dynamic Streaming Dashboard</h1>
        
        <div class="dashboard">
            <div class="card">
                <h2>📋 Topics</h2>
                <button class="refresh-btn" onclick="loadTopics()">Refresh Topics</button>
                <table id="topicsTable">
                    <thead>
                        <tr>
                            <th>Topic Name</th>
                            <th>Status</th>
                            <th>Created At</th>
                        </tr>
                    </thead>
                    <tbody id="topicsBody">
                        <tr><td colspan="3" class="no-data">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <div class="card">
                <h2>👥 User Subscriptions</h2>
                <button class="refresh-btn" onclick="loadSubscriptions()">Refresh Subscriptions</button>
                <table id="subscriptionsTable">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Topic</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="subscriptionsBody">
                        <tr><td colspan="3" class="no-data">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadTopics() {
            fetch('/api/topics')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('topicsBody');
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="no-data">No topics found</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.map(topic => `
                        <tr>
                            <td>${topic.topic_name}</td>
                            <td><span class="status status-${topic.status}">${topic.status.toUpperCase()}</span></td>
                            <td>${new Date(topic.created_at).toLocaleString()}</td>
                        </tr>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error loading topics:', error);
                    document.getElementById('topicsBody').innerHTML = 
                        '<tr><td colspan="3" class="no-data">Error loading topics</td></tr>';
                });
        }

        function loadSubscriptions() {
            fetch('/api/subscriptions')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('subscriptionsBody');
                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="no-data">No subscriptions found</td></tr>';
                        return;
                    }
                    tbody.innerHTML = data.map(sub => `
                        <tr>
                            <td>${sub.user_id}</td>
                            <td>${sub.topic_name}</td>
                            <td><span class="status status-${sub.status}">${sub.status.toUpperCase()}</span></td>
                        </tr>
                    `).join('');
                })
                .catch(error => {
                    console.error('Error loading subscriptions:', error);
                    document.getElementById('subscriptionsBody').innerHTML = 
                        '<tr><td colspan="3" class="no-data">Error loading subscriptions</td></tr>';
                });
        }

        // Load data on page load
        loadTopics();
        loadSubscriptions();

        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadTopics();
            loadSubscriptions();
        }, 5000);
    </script>
</body>
</html>
